# Либерея — конфигурация. Скопируйте в config.toml и поправьте под себя.
# Пути к библиотекам, их названия, пароль администратора и т. п. можно задать и в браузере:
# Админка → «Настройки» (они сохраняются в data/settings.toml и накладываются поверх этого файла).

[server]
host = "0.0.0.0"     # слушать на всех адресах: открывать http://localhost:5555 или http://<IP компьютера>:5555
                     # "127.0.0.1" — только с этого компьютера
port = 5555

[site]
title = "Либерея"
page_size = 24            # карточек на странице поиска
covers_page_size = 120    # обложек на странице в режиме «Только обложки»
list_page_size = 100      # строк на странице в режиме «Списком»

# Три части библиотеки: [library] — основная, [extra] — дополнительная, [inpx] — коллекция INPX. У каждой:
#   enabled = true/false — включить или отключить целиком (книги отключённой части нигде не показываются,
#                          данные в базе сохраняются; включили обратно — всё на месте, пересканировать не нужно)
#   label = "…"          — название в фильтре «Библиотека», на стартовой странице и в карточке книги

[library]
enabled = true
label = "Основная"
# Корневая папка с книгами: внутри — папки «код Название (Автор)», в каждой текст .txt и обложка (необязательно).
# Например: 'D:\Books\Library' или '/srv/books/library'. Пусто — часть не используется.
root = ""
# Расширения файлов
text_ext  = [".txt"]
cover_ext = [".jpg", ".jpeg", ".png", ".webp", ".gif", ".bmp"]

[extra]
enabled = true
label = "Дополнительная"
# Папка со всеми подпапками: каждый файл .txt/.fb2 — отдельная книга.
# Название = имя файла, автор — из FB2 (если есть). Коды книг: ex-00001, ex-00002, ...
# Например: 'D:\Books\Other' или '/srv/books/other'. Пусто — часть не используется.
root = ""
prefix = "ex"
# Дубликаты (одно имя файла в .txt и .fb2): выбирается вариант с бОльшим объёмом чистого текста.
#   "tree"   — одинаковые имена ищутся по всем подпапкам
#   "folder" — только внутри одной папки
dedup = "tree"

[inpx]
# Коллекция в формате INPX (каталог MyHomeLib): файл .inpx + zip-архивы с книгами. Импортируются только метаданные —
# автор, название, серия, жанр, язык; текст не индексируется. Книги читаются прямо из zip-архивов.
# Новая версия коллекции: замените файл .inpx и нажмите в админке «Обновить из .inpx».
# Например: file = 'D:\Books\Collection\collection.inpx'. Пусто — часть не используется.
file = ""
root = ""                    # папка с архивами *.zip (пусто — папка файла .inpx)
enabled = true
prefix = "ix"                # коды книг: ix-<номер книги в коллекции>
label = "Коллекция INPX"     # название в фильтре «Библиотека»
skip_deleted = true          # не импортировать книги, помеченные удалёнными
langs = []                   # только эти языки, например ["ru", "en"]; пусто — все
genres = []                  # только эти жанры, например ["sf_fantasy", "detective"]; пусто — все
exclude_genres = []          # исключить жанры

[storage]
# Где хранить базу и кеш (относительно папки программы или абсолютный путь)
database = "data/library.db"
cache    = "data/cache"

[pdf]
# Шрифты с кириллицей. По умолчанию — встроенные DejaVu из папки fonts.
font_regular = "fonts/DejaVuSerif.ttf"
font_bold    = "fonts/DejaVuSerif-Bold.ttf"
font_italic  = "fonts/DejaVuSerif-Italic.ttf"
font_size    = 11
page_format  = "A5"       # A4 / A5

[fb2]
# Жанр в метаданных собранных FB2 (коды жанров FB2: prose, sf, detective, love_contemporary, ...)
genre = "prose"

[translate]
# Перевод английских книг на русский.
#   engine = "local"  — бесплатно, без интернета. Один раз скачайте модель:  python manage.py get-model
#   engine = "yandex" — Яндекс Переводчик (Yandex Cloud, платно), нужны ключ API и ID каталога
#   engine = "off"    — выключить
engine = "local"
model_dir = "data/models/en_ru"
threads = 0              # потоков процессора (0 — все)
beam = 2                 # 1 — быстрее, 2–4 — чуть качественнее и медленнее
allow = "all"            # кто может нажимать «Перевести»: "all" или "admin"
yandex_api_key = ""
yandex_folder_id = ""

[llm]
# Качественный (литературный) перевод локальной языковой моделью.
# Нужна запущенная программа с OpenAI-совместимым сервером:
#   LM Studio  — url = "http://127.0.0.1:1234/v1"   (вкладка Developer → Start Server)
#   Ollama     — url = "http://127.0.0.1:11434/v1"
enabled = false
url = "http://127.0.0.1:1234/v1"
model = ""              # имя модели; пусто — первая загруженная в LM Studio
chunk_chars = 1500      # размер фрагмента оригинала на один запрос
temperature = 0.3
use_draft = true        # давать модели черновой перевод (Argos) как подсказку
timeout = 900           # секунд на один фрагмент
# system_prompt = "..." # свой текст инструкции для модели (необязательно)

[admin]
# Пароль администратора. Обычно его задают при первом входе в админку (мастер первого запуска).
# Вручную: хеш из  python manage.py hash-password  → password_hash; или открытым текстом в password.
password = ""
password_hash = ""
# Секрет для подписи cookie (сгенерируется автоматически, если пусто)
secret = ""
